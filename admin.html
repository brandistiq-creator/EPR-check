<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EPR Check — Admin</title>
<style>
:root{--ink:#101828;--muted:#667085;--blue:#1463ff;--soft:#f5f8ff;--line:#e4e7ec;--green:#067647;--orange:#b54708;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:28px 18px 70px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
.brand{font-weight:800;font-size:22px}.brand span{color:var(--blue)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 28px rgba(16,24,40,.05);margin-bottom:18px}
h1{font-size:32px;margin:0 0 6px}h2{font-size:22px;margin:0 0 14px}p{color:#475467}
input,button{font:inherit}input{width:100%;padding:12px 14px;border:1px solid #cfd5df;border-radius:11px}
button{border:0;border-radius:11px;padding:11px 15px;font-weight:750;cursor:pointer}
.primary{background:var(--blue);color:#fff}.secondary{background:#eef4ff;color:#1452c7}.ghost{background:#f2f4f7;color:#344054}
.error{color:var(--red);margin-top:10px}.hidden{display:none!important}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;text-transform:uppercase;color:var(--muted)}
.badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:#ecfdf3;color:var(--green);font-size:12px;font-weight:800}
small{color:var(--muted)}.empty{text-align:center;padding:35px;color:var(--muted)}
.report-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
iframe{width:100%;height:78vh;border:1px solid var(--line);border-radius:14px;background:#fff}
.stat{display:flex;gap:14px;flex-wrap:wrap}.stat div{background:var(--soft);border:1px solid #dbe6ff;border-radius:14px;padding:12px 16px}.stat b{font-size:22px;display:block}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand">✓ <span>EPR Check</span> Admin</div><button id="logout" class="ghost hidden">Odjava</button></header>

<section id="loginCard" class="card">
<h1>Administracija EPR Reporta</h1>
<p>Ovaj dio je namijenjen samo vlasniku stranice. Prijave dolaze iz Netlify Forma <b>epr-report</b>.</p>
<label>Admin lozinka</label>
<input id="password" type="password" autocomplete="current-password" placeholder="Unesite admin lozinku">
<div style="margin-top:12px"><button id="login" class="primary">Otvori prijave</button></div>
<div id="loginError" class="error"></div>
</section>

<section id="dashboard" class="hidden">
<div class="card">
<div class="toolbar" style="justify-content:space-between">
<div><h1>Zahtjevi za EPR Report</h1><p style="margin:0">Odaberite prijavu i izradite pregled.</p></div>
<div class="toolbar"><button id="refresh" class="secondary">↻ Osvježi</button></div>
</div>
<div class="stat" style="margin-top:18px"><div><small>Zaprimljeno</small><b id="count">0</b></div><div><small>Forma</small><b style="font-size:18px">epr-report</b></div></div>
</div>

<div class="card">
<div class="table-wrap">
<table><thead><tr><th>Datum</th><th>Klijent</th><th>Email</th><th>Sažetak</th><th></th></tr></thead>
<tbody id="rows"></tbody></table>
<div id="empty" class="empty hidden">Nema zaprimljenih prijava.</div>
</div>
</div>

<div id="reportCard" class="card hidden">
<div class="toolbar" style="justify-content:space-between">
<div><h2>Pregled Reporta</h2><small id="selected"></small></div>
<button id="closeReport" class="ghost">Zatvori</button>
</div>
<div class="report-actions">
<button id="print" class="primary">🖨 Ispis / Spremi kao PDF</button>
<button id="open" class="secondary">Otvori u novoj kartici</button>
</div>
<div style="margin-top:16px"><iframe id="reportFrame" title="EPR Report"></iframe></div>
</div>
</section>
</div>

<script>
const $=s=>document.querySelector(s);
let adminPassword=sessionStorage.getItem("epr_admin_password")||"";
let currentReportUrl="";

async function api(url){
  const r=await fetch(url,{headers:{"x-admin-password":adminPassword}});
  const text=await r.text();
  let data; try{data=JSON.parse(text)}catch{throw new Error(text||"Greška")}
  if(!r.ok) throw new Error(data.error||"Greška");
  return data;
}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function pick(data, keys){
  const entries=Object.entries(data||{});
  for(const k of keys){
    const hit=entries.find(([name])=>name.toLowerCase().replace(/[^a-z0-9čćđšž]/g,"").includes(k));
    if(hit && hit[1]) return Array.isArray(hit[1])?hit[1].join(", "):hit[1];
  }
  return "";
}
function clientName(s){
  const d=s.data||{};
  return pick(d,["imeiprezime","nazivposlovnogsubjekta","company","name","klijent"]) || s.name || s.title || "Bez naziva";
}
function email(s){return pick(s.data,["email","e-mail"])||s.email||""}
function summary(s){
  const d=s.data||{};
  const countries=Object.entries(d).filter(([k,v])=>/njema|austr|sloven|ital|franc/i.test(String(k)+" "+String(v))).map(([,v])=>v).filter(Boolean).join(", ");
  return countries || s.summary || "Podaci iz prijave";
}
function renderRows(items){
  $("#count").textContent=items.length;
  $("#rows").innerHTML=items.map(s=>`
  <tr><td><small>${esc(new Date(s.created_at).toLocaleString("hr-HR"))}</small></td>
  <td><b>${esc(clientName(s))}</b></td><td>${esc(email(s))}</td>
  <td><span class="badge">${esc(summary(s))}</span></td>
  <td><button class="secondary" data-id="${esc(s.id)}">Izradi Report</button></td></tr>`).join("");
  $("#empty").classList.toggle("hidden",items.length!==0);
  document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>openReport(b.dataset.id,items.find(x=>x.id===b.dataset.id)));
}
async function load(){
  try{
    const data=await api("/.netlify/functions/epr-admin?action=list");
    renderRows(data.submissions||[]);
  }catch(e){alert(e.message)}
}
async function openReport(id,s){
  currentReportUrl="/.netlify/functions/epr-admin?action=report&id="+encodeURIComponent(id);
  $("#reportFrame").src=currentReportUrl;
  $("#selected").textContent=clientName(s)+" · "+email(s);
  $("#reportCard").classList.remove("hidden");
  $("#reportCard").scrollIntoView({behavior:"smooth"});
}
$("#login").onclick=async()=>{
  adminPassword=$("#password").value.trim();
  if(!adminPassword)return;
  try{await api("/.netlify/functions/epr-admin?action=list");sessionStorage.setItem("epr_admin_password",adminPassword);$("#loginCard").classList.add("hidden");$("#dashboard").classList.remove("hidden");$("#logout").classList.remove("hidden");load();}
  catch(e){$("#loginError").textContent="Neispravna lozinka ili admin funkcija još nije postavljena."}
};
$("#password").addEventListener("keydown",e=>{if(e.key==="Enter")$("#login").click()});
$("#refresh").onclick=load;
$("#closeReport").onclick=()=>$("#reportCard").classList.add("hidden");
$("#open").onclick=()=>window.open(currentReportUrl,"_blank");
$("#print").onclick=()=>{const f=$("#reportFrame");f.contentWindow.focus();f.contentWindow.print()};
$("#logout").onclick=()=>{sessionStorage.removeItem("epr_admin_password");location.reload()};
if(adminPassword){$("#password").value=adminPassword;$("#login").click()}
</script>
</body>
</html>

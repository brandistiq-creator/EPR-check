<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EPR Admin — Reporti</title>
<style>
:root{--ink:#101828;--muted:#667085;--line:#e4e7ec;--soft:#f7f9fc;--blue:#175cd3;--green:#067647;--amber:#b54708;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1200px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.brand{font-weight:850;font-size:20px}.user{color:var(--muted);font-size:12px}
button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 13px;font-weight:750;cursor:pointer}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.green{background:#ecfdf3;border-color:#abefc6;color:var(--green)}.danger{background:#fef3f2;border-color:#fecdca;color:var(--red)}
.grid{display:grid;grid-template-columns:360px 1fr;gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.panel h2{font-size:17px;margin:0 0 10px}.muted{color:var(--muted);font-size:12px}
.list{display:grid;gap:8px;max-height:75vh;overflow:auto}.item{border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}.item:hover,.item.active{border-color:#84adff;background:#eff8ff}.item b{display:block}.item small{display:block;color:var(--muted);margin-top:3px}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px}.metric small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:800}.metric b{display:block;margin-top:3px}
.section{border-top:1px solid var(--line);padding-top:15px;margin-top:15px}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#eff8ff;color:#175cd3;font-size:11px;font-weight:800;margin:3px}
textarea,input,select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;font:inherit}textarea{min-height:110px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.empty{padding:30px;text-align:center;color:var(--muted)}
.hidden{display:none!important}.notice{padding:12px 14px;border-radius:12px;background:#fffaeb;border:1px solid #fedf89;color:#7a4e00;margin-bottom:12px;font-size:12px}
#login{max-width:480px;margin:12vh auto}.loginbox{background:#fff;border:1px solid var(--line);border-radius:20px;padding:25px}.loginbox h1{margin-top:0}.row{margin:10px 0}.row label{display:block;font-size:12px;font-weight:750;margin-bottom:5px}
@media(max-width:850px){.grid{grid-template-columns:1fr}.meta{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="login" class="hidden">
<div class="loginbox">
<h1>EPR Admin</h1>
<p class="muted">Prijavite se administratorskim Netlify Identity računom.</p>
<div class="row"><label>Email</label><input id="email" type="email"></div>
<div class="row"><label>Lozinka</label><input id="password" type="password"></div>
<div class="actions"><button class="primary" id="loginBtn">Prijava</button></div>
<div id="loginMsg" class="muted" style="margin-top:10px"></div>
</div></div>

<div id="app" class="wrap hidden">
<div class="top"><div><div class="brand">EPR Admin · Reporti</div><div class="user" id="user"></div></div><button id="logout">Odjava</button></div>
<div id="notice" class="notice hidden"></div>
<div class="grid">
<section class="panel">
<h2>Prijave za Report</h2>
<p class="muted">Verified Netlify Forms submissions. Kliknite prijavu za pregled i izradu nacrta.</p>
<div id="list" class="list"><div class="empty">Učitavanje…</div></div>
</section>

<section class="panel">
<div id="detail" class="empty">Odaberite prijavu.</div>
</section>
</div>
</div>

<script type="module">
import { getUser, login, logout } from 'https://esm.sh/@netlify/identity@2.0.1';

const $=s=>document.querySelector(s);
let submissions=[], selected=null;

async function api(path, options={}) {
  const r=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});
  const text=await r.text();
  let data; try{data=JSON.parse(text)}catch{data={message:text}};
  if(!r.ok) throw new Error(data.message||`HTTP ${r.status}`);
  return data;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function fmtDate(x){try{return new Date(x).toLocaleString('hr-HR')}catch{return x||''}}
function dataOf(s){return s?.data||{}}

async function boot(){
  try{
    const u=await getUser();
    if(!u){$('#login').classList.remove('hidden');return;}
    $('#app').classList.remove('hidden');$('#user').textContent=`Prijavljen: ${u.email}`;
    await load();
  }catch(e){$('#login').classList.remove('hidden');$('#loginMsg').textContent=e.message}
}
async function load(){
  try{
    const r=await api('/.netlify/functions/admin-submissions');
    submissions=r.submissions||[];
    renderList();
    if(submissions[0]) select(submissions[0].id);
  }catch(e){$('#notice').textContent=e.message;$('#notice').classList.remove('hidden');$('#list').innerHTML='<div class="empty">Nije moguće učitati prijave.</div>'}
}
function renderList(){
  $('#list').innerHTML=submissions.length?submissions.map(s=>{
    const d=dataOf(s), markets=d.packaging_markets||d.countries||'';
    return `<div class="item ${selected?.id===s.id?'active':''}" data-id="${esc(s.id)}">
      <b>${esc(s.name||d.name||s.email||'Bez imena')}</b>
      <small>${esc(s.company||d.company||'Bez tvrtke')} · ${esc(fmtDate(s.created_at))}</small>
      <small>${esc(markets||'Tržište nije navedeno')} · ${esc(d.packaging_total_kg||'—')} kg</small>
    </div>`
  }).join(''):'<div class="empty">Nema prijava.</div>';
}
$('#list').addEventListener('click',e=>{const x=e.target.closest('.item');if(x)select(x.dataset.id)});
function select(id){
  selected=submissions.find(x=>x.id===id);renderList();renderDetail();
}
function renderDetail(){
  if(!selected){$('#detail').innerHTML='<div class="empty">Odaberite prijavu.</div>';return}
  const d=dataOf(selected), markets=(d.packaging_markets||'').split(',').map(x=>x.trim()).filter(Boolean);
  const status=d.epr_report_status||'Novi zahtjev';
  $('#detail').innerHTML=`
    <h2>${esc(selected.name||'Prijava')}</h2>
    <div class="meta">
      <div class="metric"><small>Status</small><b>${esc(status)}</b></div>
      <div class="metric"><small>Email</small><b>${esc(selected.email||d.email||'—')}</b></div>
      <div class="metric"><small>Tvrtka</small><b>${esc(selected.company||d.company||'—')}</b></div>
    </div>
    <div class="section"><b>Tržišta</b><div>${markets.map(x=>`<span class="tag">${esc(x)}</span>`).join('')||'—'}</div></div>
    <div class="section"><b>Ambalaža iz kalkulatora</b><p>${esc(d.packaging_totals||'Nema podataka')}</p><p class="muted">Ukupno: ${esc(d.packaging_total_kg||'—')} kg</p></div>
    <div class="section"><b>Napomena / opseg klijenta</b><p>${esc(d.scope||d.message||selected.body||'—')}</p></div>
    <div class="section"><label><b>Interna bilješka</b></label><textarea id="note">${esc(d.admin_note||'')}</textarea></div>
    <div class="actions">
      <button class="primary" id="draft">Generiraj Draft Report</button>
      <button class="green" id="approve">Odobri i generiraj finalni Report</button>
      <button class="secondary" id="saveNote">Spremi bilješku</button>
    </div>
    <div id="result" style="margin-top:12px"></div>`;
  $('#draft').onclick=()=>generate(false);
  $('#approve').onclick=()=>generate(true);
  $('#saveNote').onclick=()=>saveNote();
}
async function saveNote(){
  try{
    const r=await api('/.netlify/functions/admin-report',{method:'POST',body:JSON.stringify({action:'note',submissionId:selected.id,note:$('#note').value})});
    selected.data={...(selected.data||{}),admin_note:$('#note').value,epr_report_status:r.status};
    renderDetail();$('#result').textContent='Bilješka spremljena.';
  }catch(e){$('#result').textContent=e.message}
}
async function generate(approve){
  const r=$('#result');r.textContent='Generiram…';
  try{
    const out=await api('/.netlify/functions/admin-report',{method:'POST',body:JSON.stringify({action:approve?'approve':'draft',submissionId:selected.id})});
    r.innerHTML=`<div class="notice" style="margin-top:0">${esc(out.message)}</div>
      <div class="actions"><a href="${esc(out.previewUrl)}" target="_blank"><button class="primary">Otvori Report</button></a>
      <a href="${esc(out.downloadUrl)}" download><button class="secondary">Preuzmi HTML</button></a></div>`;
    await load();select(selected.id);
  }catch(e){r.textContent=e.message}
}
$('#loginBtn').onclick=async()=>{try{await login($('#email').value,$('#password').value);location.reload()}catch(e){$('#loginMsg').textContent=e.message}};
$('#logout').onclick=async()=>{await logout();location.reload()};
boot();
</script>
</body>
</html>

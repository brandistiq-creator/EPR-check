<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EPR Report — Draft</title><link rel="stylesheet" href="styles.css"></head>
<body><main><section class="pagehero"><div class="container article"><span class="eyebrow" style="background:#eef3ff;border-color:#d9e3ff;color:#315efb">EPR REPORT · DRAFT</span><h1>Personalizirani EPR pregled</h1><p>Ovaj dokument je automatski nacrt i mora proći ljudsku provjeru prije slanja klijentu.</p><div id="meta"></div><div id="markets"></div><div class="callout"><strong>Napomena:</strong> Ovaj izvještaj je informativan i nije pravno mišljenje. Provjerite aktualne službene izvore prije provedbe.</div></div></section></main>
<script src="report-engine.js"></script><script>
const params=new URLSearchParams(location.search); const data=JSON.parse(params.get('data')||'{}'); const d=EPR_REPORT_ENGINE.buildDraft(data);
document.getElementById('meta').innerHTML='<div class="card"><strong>Report ID:</strong> '+d.reportId+'<br><strong>Webshop:</strong> '+(d.client.webshop||'—')+'<br><strong>Klijent:</strong> '+(d.client.name||'—')+'<br><strong>Email:</strong> '+(d.client.email||'—')+'</div>';
document.getElementById('markets').innerHTML=d.markets.map(m=>'<section class="card" style="margin-top:18px"><span class="tag">'+m.market+'</span><h2>Što provjeriti</h2><ul>'+m.source.facts.map(f=>'<li>'+f+'</li>').join('')+'</ul><p><a class="back" target="_blank" href="'+m.source.url+'">Službeni izvor →</a></p></section>').join('');
</script></body></html>
